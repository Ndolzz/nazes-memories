name: Push notification (memory baru)

# Kirim notifikasi "memory baru" ke semua subscriber sekali sehari.
# Bisa juga dijalankan manual dari tab Actions untuk tes.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC setiap hari
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Kirim push notification jika ada memory baru
        run: node scripts/notify.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ secrets.SITE_URL }}
