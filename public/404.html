<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Naze's Memories</title>
    <!--
      GitHub Pages tidak mendukung SPA routing secara native (setiap URL
      selain "/" akan 404 di server). Trik ini menyimpan path yang diminta
      lalu redirect ke index.html, yang kemudian membaca sessionStorage dan
      mengarahkan React Router ke path yang benar (lihat script di index.html).
    -->
    <script>
      sessionStorage.setItem('naze:redirect', location.pathname + location.search + location.hash);
      location.replace('./');
    </script>
  </head>
  <body></body>
</html>
